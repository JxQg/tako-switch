name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to GITHUB_REF_NAME)"
        required: false
        default: ""
      allow_unsigned_mac:
        description: "Allow unsigned macOS build when Apple secrets are not configured"
        type: boolean
        required: false
        default: false
      resync_tag:
        description: "CDN repair mode: skip builds, re-download binaries from this GitHub Release tag and re-push to R2 + DogeCloud origins behind dl.lven.asia"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            updater_key: darwin-aarch64
            asset_prefix: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            updater_key: darwin-x86_64
            asset_prefix: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            updater_key: windows-x86_64
            asset_prefix: windows-x64
    runs-on: ${{ matrix.os }}
    if: ${{ inputs.resync_tag == '' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check macOS Apple signing secrets
        if: runner.os == 'macOS'
        id: mac_sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$KEYCHAIN_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.allow_unsigned_mac }}" = "true" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing Apple signing secrets (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, KEYCHAIN_PASSWORD)."
            exit 1
          fi

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && steps.mac_sign.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | (base64 --decode 2>/dev/null || base64 -D) > "$cert"
          chmod 600 "$cert"

          orig_kc=$(security default-keychain -d user | tr -d '"' | xargs)
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$orig_kc" >> "$GITHUB_ENV"

          kc="$RUNNER_TEMP/build.keychain-db"
          echo "BUILD_KEYCHAIN_PATH=$kc" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security default-keychain -s "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security import "$cert" \
            -k "$kc" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$kc"
          rm -f "$cert"

          identity=$(security find-identity -v -p codesigning "$kc" \
            | grep "Developer ID Application" | grep -oE '"[^"]+"' | head -1 | tr -d '"' || true)
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity found in imported keychain."
            security find-identity -v -p codesigning "$kc"
            exit 1
          fi
          echo "Signing identity: $identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle (macOS, signed & notarized with retry)
        if: runner.os == 'macOS' && steps.mac_sign.outputs.signed == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "=== macOS build/notarization attempt ${attempt}/3 ==="
            if npx tauri build --target ${{ matrix.target }}; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 45))
          done

      - name: Build Tauri bundle (macOS unsigned test)
        if: runner.os == 'macOS' && steps.mac_sign.outputs.signed == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build Tauri bundle (Windows)
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Cleanup temporary Apple keychain
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ] && [ -f "$ORIGINAL_DEFAULT_KEYCHAIN" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -n "${BUILD_KEYCHAIN_PATH:-}" ] && [ -f "$BUILD_KEYCHAIN_PATH" ]; then
            security delete-keychain "$BUILD_KEYCHAIN_PATH" || true
          fi

      - name: Collect release and updater artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          version="${tag#v}"
          out="$RUNNER_TEMP/dist-assets"
          mkdir -p "$out"
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          dmg_src=$(ls "$bundle_dir"/dmg/*.dmg | head -1)
          tar_src=$(ls "$bundle_dir"/macos/*.app.tar.gz | head -1)
          sig_src=$(ls "$bundle_dir"/macos/*.app.tar.gz.sig | head -1)
          cp "$dmg_src" "$out/Tako-Switch_${version}_${{ matrix.asset_prefix }}.dmg"
          cp "$tar_src" "$out/Tako-Switch_${{ matrix.asset_prefix }}.app.tar.gz"
          cp "$sig_src" "$out/Tako-Switch_${{ matrix.asset_prefix }}.app.tar.gz.sig"
          cat > "$out/platform-meta.json" <<EOF
          {
            "updaterKey": "${{ matrix.updater_key }}",
            "updaterAsset": "Tako-Switch_${{ matrix.asset_prefix }}.app.tar.gz",
            "sigAsset": "Tako-Switch_${{ matrix.asset_prefix }}.app.tar.gz.sig"
          }
          EOF

      - name: Collect release and updater artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { $env:GITHUB_REF_NAME }
          $version = $tag.TrimStart("v")
          $out = "$env:RUNNER_TEMP\dist-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $nsis = "src-tauri\target\${{ matrix.target }}\release\bundle\nsis"
          $exe = Get-ChildItem "$nsis\*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$nsis\*-setup.exe.sig" | Select-Object -First 1
          $cleanExe = "Tako-Switch_${version}_windows-x64-setup.exe"
          $cleanSig = "Tako-Switch_${version}_windows-x64-setup.exe.sig"
          Copy-Item $exe.FullName "$out\$cleanExe"
          Copy-Item $sig.FullName "$out\$cleanSig"
          @{
            updaterKey = "${{ matrix.updater_key }}"
            updaterAsset = $cleanExe
            sigAsset = $cleanSig
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "$out\platform-meta.json"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.asset_prefix }}
          path: ${{ runner.temp }}/dist-assets/*
          if-no-files-found: error

  publish:
    name: Publish Release, Checksums & Latest-Only Prune
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && (inputs.resync_tag != '' || needs.build.result == 'success') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: ${{ inputs.resync_tag == '' }}
        with:
          path: collected
          pattern: assets-*

      - name: Download binaries from existing GitHub Release (CDN resync repair)
        if: ${{ inputs.resync_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESYNC_TAG: ${{ inputs.resync_tag }}
        run: |
          set -euo pipefail
          tag="$RESYNC_TAG"
          mkdir -p release-files
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --dir release-files --clobber
          python3 - <<'PY'
          import json, os
          tag = os.environ["RESYNC_TAG"]
          gh_base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          cn_base = f"https://dl.lven.asia/tako-switch/releases/{tag}"
          data = json.load(open("release-files/latest.json", encoding="utf-8"))
          if data.get("version") != tag.lstrip("v"):
              raise SystemExit(f"latest.json version {data.get('version')} does not match tag {tag}; refusing to resync")
          for plat in (data.get("platforms") or {}).values():
              url = str(plat.get("url") or "")
              if not url.startswith(gh_base + "/"):
                  raise SystemExit(f"unexpected upstream platform url {url}; refusing to rewrite")
              plat["url"] = cn_base + url[len(gh_base):]
          json.dump(data, open("latest-cn.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          echo "=== resync payload ==="
          ls -la release-files
          cat latest-cn.json

      - name: Generate latest.json, SHA256SUMS.txt, publish Release & prune old v2 releases
        if: ${{ inputs.resync_tag == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          version="${tag#v}"
          mkdir -p release-files
          python3 scripts/extract_release_notes.py --changelog CHANGELOG.md --tag "$tag" --out release-notes.md
          echo "=== Extracted release notes for $tag ==="
          cat release-notes.md
          python3 - <<'PY'
          import datetime, glob, hashlib, json, os, shutil

          tag = os.environ.get("TAG_INPUT") or os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          repo = os.environ["GITHUB_REPOSITORY"]
          gh_base = f"https://github.com/{repo}/releases/download/{tag}"
          platforms_gh = {}
          platforms_cn = {}
          cn_base = f"https://dl.lven.asia/tako-switch/releases/{tag}"

          for meta_path in sorted(glob.glob("collected/*/platform-meta.json")):
              folder = os.path.dirname(meta_path)
              meta = json.load(open(meta_path, encoding="utf-8"))
              for fname in os.listdir(folder):
                  if fname == "platform-meta.json":
                      continue
                  shutil.copy2(os.path.join(folder, fname), os.path.join("release-files", fname))
              sig = open(os.path.join(folder, meta["sigAsset"]), encoding="utf-8").read().strip()
              asset = meta["updaterAsset"]
              platforms_gh[meta["updaterKey"]] = {
                  "signature": sig,
                  "url": f"{gh_base}/{asset}",
              }
              platforms_cn[meta["updaterKey"]] = {
                  "signature": sig,
                  "url": f"{cn_base}/{asset}",
              }

          notes = open("release-notes.md", encoding="utf-8").read().strip() or f"Tako Switch {tag}"
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          json.dump(
              {"version": version, "notes": notes, "pub_date": now, "platforms": platforms_gh},
              open("release-files/latest.json", "w", encoding="utf-8"),
              ensure_ascii=False,
              indent=2,
          )
          json.dump(
              {"version": version, "notes": notes, "pub_date": now, "platforms": platforms_cn},
              open("latest-cn.json", "w", encoding="utf-8"),
              ensure_ascii=False,
              indent=2,
          )

          sums = []
          for fname in sorted(os.listdir("release-files")):
              if fname.endswith((".dmg", ".tar.gz", ".exe")):
                  h = hashlib.sha256(open(os.path.join("release-files", fname), "rb").read()).hexdigest()
                  sums.append(f"{h}  {fname}\n")
          open("release-files/SHA256SUMS.txt", "w", encoding="utf-8").writelines(sums)
          PY

          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$tag" release-files/* -R "$GITHUB_REPOSITORY" --title "Tako Switch $tag" --notes-file release-notes.md --latest
          fi

          # Retain only the newest v2.* release on GitHub Releases (never touch legacy v4.* releases).
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | while read -r old_tag; do
            case "$old_tag" in
              v2.*)
                if [ "$old_tag" != "$tag" ]; then
                  echo "Pruning obsolete v2 release: $old_tag"
                  gh release delete "$old_tag" -R "$GITHUB_REPOSITORY" --yes || true
                fi
                ;;
            esac
          done

      - name: Sync release binaries & latest.json to China CDN origins (R2 + DogeCloud OSS -> dl.lven.asia)
        env:
          TAG_INPUT: ${{ inputs.tag }}
          RESYNC_TAG: ${{ inputs.resync_tag }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          DOGE_ACCESS_KEY: ${{ secrets.DOGE_ACCESS_KEY }}
          DOGE_SECRET_KEY: ${{ secrets.DOGE_SECRET_KEY }}
          DOGE_OSS_BUCKET: ${{ secrets.DOGE_OSS_BUCKET }}
        run: |
          set -euo pipefail
          tag="${RESYNC_TAG:-${TAG_INPUT:-$GITHUB_REF_NAME}}"
          extra=(--verify)
          if [ -n "$RESYNC_TAG" ]; then
            extra+=(--require r2 --require doge)
          fi
          python3 scripts/sync-release-cdn.py --tag "$tag" "${extra[@]}"

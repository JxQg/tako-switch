name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to GITHUB_REF_NAME)"
        required: false
        default: ""
      allow_unsigned_mac:
        description: "Allow unsigned macOS build when Apple secrets are not configured"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            updater_key: darwin-aarch64
            asset_prefix: darwin-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            updater_key: darwin-x86_64
            asset_prefix: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            updater_key: windows-x86_64
            asset_prefix: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check macOS Apple signing secrets
        if: runner.os == 'macOS'
        id: mac_sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$KEYCHAIN_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.allow_unsigned_mac }}" = "true" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing Apple signing secrets (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, KEYCHAIN_PASSWORD). Copy them from tako-dev/dsh-tako-desktop or pass allow_unsigned_mac=true for testing."
            exit 1
          fi

      - name: Prepare Apple signing identity
        if: runner.os == 'macOS' && steps.mac_sign.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/cert.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          chmod 600 "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          identity=$(security find-identity -p codesigning "$keychain" | grep -oE '"Developer ID Application: [^"]+"' | head -1 | tr -d '"' || true)
          security delete-keychain "$keychain"
          rm -f "$cert"
          if [ -z "$identity" ]; then
            echo "::error::Could not extract Developer ID Application identity from APPLE_CERTIFICATE."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build signed/unsigned Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect release and updater artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dist-assets"
          mkdir -p "$out"
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          cp "$bundle_dir"/dmg/*.dmg "$out/" || true
          tar_src=$(ls "$bundle_dir"/macos/*.app.tar.gz | head -1)
          sig_src=$(ls "$bundle_dir"/macos/*.app.tar.gz.sig | head -1)
          cp "$tar_src" "$out/Tako-Switch_${{ matrix.asset_prefix }}.app.tar.gz"
          cp "$sig_src" "$out/Tako-Switch_${{ matrix.asset_prefix }}.app.tar.gz.sig"
          cat > "$out/platform-meta.json" <<EOF
          {
            "updaterKey": "${{ matrix.updater_key }}",
            "updaterAsset": "Tako-Switch_${{ matrix.asset_prefix }}.app.tar.gz",
            "sigAsset": "Tako-Switch_${{ matrix.asset_prefix }}.app.tar.gz.sig"
          }
          EOF

      - name: Collect release and updater artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\dist-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $nsis = "src-tauri\target\${{ matrix.target }}\release\bundle\nsis"
          $exe = Get-ChildItem "$nsis\*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$nsis\*-setup.exe.sig" | Select-Object -First 1
          $cleanExe = "Tako-Switch_windows-x64-setup.exe"
          $cleanSig = "Tako-Switch_windows-x64-setup.exe.sig"
          Copy-Item $exe.FullName "$out\$cleanExe"
          Copy-Item $sig.FullName "$out\$cleanSig"
          @{
            updaterKey = "${{ matrix.updater_key }}"
            updaterAsset = $cleanExe
            sigAsset = $cleanSig
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "$out\platform-meta.json"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.asset_prefix }}
          path: ${{ runner.temp }}/dist-assets/*
          if-no-files-found: error

  publish:
    name: Publish Release & Updater JSON
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: assets-*

      - name: Generate latest.json and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          MIRROR_SELF_BASE: ${{ vars.MIRROR_SELF_BASE }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          version="${tag#v}"
          mkdir -p release-files
          python3 - <<'PY'
          import datetime, glob, json, os, shutil

          tag = os.environ.get("TAG_INPUT") or os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          repo = os.environ["GITHUB_REPOSITORY"]
          gh_base = f"https://github.com/{repo}/releases/download/{tag}"

          platforms_gh = {}
          platforms_mirror = {}
          mirror_base = os.environ.get("MIRROR_SELF_BASE", "").strip().rstrip("/")

          for meta_path in sorted(glob.glob("collected/*/platform-meta.json")):
              folder = os.path.dirname(meta_path)
              meta = json.load(open(meta_path, encoding="utf-8"))
              for fname in os.listdir(folder):
                  if fname == "platform-meta.json":
                      continue
                  shutil.copy2(os.path.join(folder, fname), os.path.join("release-files", fname))
              sig = open(os.path.join(folder, meta["sigAsset"]), encoding="utf-8").read().strip()
              asset = meta["updaterAsset"]
              platforms_gh[meta["updaterKey"]] = {
                  "signature": sig,
                  "url": f"{gh_base}/{asset}",
              }
              if mirror_base:
                  platforms_mirror[meta["updaterKey"]] = {
                      "signature": sig,
                      "url": f"{mirror_base}/{tag}/{asset}",
                  }

          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          notes = f"Tako Switch {tag}"
          json.dump(
              {"version": version, "notes": notes, "pub_date": now, "platforms": platforms_gh},
              open("release-files/latest.json", "w", encoding="utf-8"),
              indent=2,
          )
          if platforms_mirror:
              json.dump(
                  {"version": version, "notes": notes, "pub_date": now, "platforms": platforms_mirror},
                  open("mirror-latest.json", "w", encoding="utf-8"),
                  indent=2,
              )
          PY

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* --clobber
          else
            gh release create "$tag" release-files/* --title "Tako Switch $tag" --generate-notes
          fi

      - name: Sync self-update binaries to China mirror bucket (optional)
        if: env.MIRROR_S3_BUCKET != ''
        env:
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MIRROR_ENDPOINT_URL }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          aws s3 sync release-files/ "s3://${MIRROR_S3_BUCKET}/tako-switch/${tag}/"
          if [ -f mirror-latest.json ]; then
            aws s3 cp mirror-latest.json "s3://${MIRROR_S3_BUCKET}/tako-switch/latest.json"
          else
            aws s3 cp release-files/latest.json "s3://${MIRROR_S3_BUCKET}/tako-switch/latest.json"
          fi
